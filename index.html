<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>銀髮族防詐騙 AI 闖關挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center h-screen">

    <div id="app" class="w-full max-w-lg bg-white p-8 rounded-xl shadow-md">
        <!-- 1. 登入畫面 -->
        <div id="login-section">
            <h1 class="text-2xl font-bold text-center mb-6 text-slate-700">防詐騙 AI 智慧闖關</h1>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600">您的姓名 / 稱呼</label>
                    <input type="text" id="name" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">聯絡電話或信箱</label>
                    <input type="text" id="contact" required class="w-full mt-1 p-2 border rounded-md">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 font-bold">開始挑戰</button>
            </form>
        </div>

        <!-- 2. 遊戲闖關畫面 (預設隱藏) -->
        <div id="game-section" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <span id="streak-badge" class="bg-orange-100 text-orange-700 text-sm font-bold px-3 py-1 rounded-full">🔥 連續答對：0 次</span>
                <span id="stage-indicator" class="text-slate-400 text-sm">第 1 題</span>
            </div>
            
            <h2 class="text-lg font-bold mb-2 text-slate-800">🚨 請注意，以下為詐騙情境：</h2>
            <p id="story-content" class="text-slate-700 mb-4 bg-red-50 p-4 rounded-lg border border-red-100"></p>
            
            <div class="space-y-3">
                <label class="block text-sm font-medium text-slate-600">請簡短說明：為什麼這是一個詐騙？破綻在哪裡？</label>
                <textarea id="user-answer" rows="3" class="w-full p-2 border rounded-md" placeholder="例如：對方要求轉帳或提供個人密碼..."></textarea>
                <button onclick="submitAnswer()" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 font-bold">送出答案讓 AI 評判</button>
            </div>
        </div>

        <!-- 3. 結果解析畫面 (預設隱藏) -->
        <div id="result-section" class="hidden">
            <h2 id="result-title" class="text-2xl font-bold mb-2"></h2>
            <p id="ai-comment" class="text-slate-700 mb-6 bg-slate-100 p-4 rounded-lg border"></p>
            <button id="next-btn" onclick="nextStory()" class="w-full bg-blue-600 text-white p-2 rounded-md font-bold">下一題</button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyVoKeDeIxm3K_Wb9deZx98viAR16F8X15UBed-IpxNHAvJAaITRIg57TfiwNywbowZ/exec"; // 記得換成你的 GAS 網址
        let stories = [];
        let currentIndex = 0;
        let streak = 0; // 連續答對次數

        async function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const contact = document.getElementById('contact').value;

            let response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', name, contact })
            });
            let result = await response.json();

            if (result.status === 'success') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('game-section').classList.remove('hidden');
                loadStories();
            }
        }

        async function loadStories() {
            let response = await fetch(GAS_URL);
            let result = await response.json();
            if (result.status === 'success') {
                stories = result.stories;
                showStory();
            }
        }

        function showStory() {
            if (currentIndex < stories.length) {
                let current = stories[currentIndex];
                document.getElementById('stage-indicator').innerText = `第 ${currentIndex + 1} / ${stories.length} 題`;
                document.getElementById('story-content').innerText = current.Content;
                document.getElementById('user-answer').value = '';
            } else {
                alert(`恭喜完成所有挑戰！你的最高連續答對紀錄：${streak} 次`);
                location.reload();
            }
        }

        async function submitAnswer() {
            let userAnswer = document.getElementById('user-answer').value.trim();
            if (!userAnswer) {
                alert("請先輸入您的判別原因再送出喔！");
                return;
            }

            let current = stories[currentIndex];

            // 顯示載入中
            let btn = document.querySelector("#game-section button");
            btn.innerText = "AI 正在評判中...";
            btn.disabled = true;

            let response = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'submit_answer',
                    userAnswer: userAnswer,
                    standardReason: current.KeyReason
                })
            });
            let result = await response.json();
            btn.innerText = "送出答案讓 AI 評判";
            btn.disabled = false;

            if (result.status === 'success') {
                document.getElementById('game-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');

                let titleEl = document.getElementById('result-title');
                let commentEl = document.getElementById('ai-comment');

                if (result.isCorrect) {
                    streak++; // 答對累積
                    titleEl.innerText = "🎉 AI 判定：回答正確！";
                    titleEl.className = "text-2xl font-bold mb-2 text-green-600";
                } else {
                    streak = 0; // 答錯歸零
                    titleEl.innerText = "❌ AI 判定：答錯或說明不足";
                    titleEl.className = "text-2xl font-bold mb-2 text-red-600";
                }

                document.getElementById('streak-badge').innerText = `🔥 連續答對：${streak} 次`;
                commentEl.innerText = result.aiComment;
            }
        }

        function nextStory() {
            currentIndex++;
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            showStory();
        }
    </script>
</body>
</html>
